# Despliegue con TLS (HTTPS): app waitress + nginx como reverse proxy.
#
# Antes de levantar:
#   1. Crea el .env en la raíz con MONGO_URI y SECRET_KEY (ver .env.example).
#   2. Coloca tu certificado en deploy/certs/server.crt y deploy/certs/server.key
#      (con certbot: `certbot certonly --standalone -d tu-dominio.com` y copia
#      fullchain.pem -> server.crt, privkey.pem -> server.key).
#   3. `docker compose up -d --build`
#
# El contenedor 'app' escucha solo en la red interna de Docker; nginx termina el
# TLS y reenvía al app con las cabeceras X-Forwarded-* que la app confía porque
# TRUST_PROXY_HEADERS=1 y SESSION_COOKIE_SECURE=1.

services:
  app:
    build: .
    env_file: .env
    environment:
      - FLASK_HOST=0.0.0.0
      - PORT=5000
      - FLASK_DEBUG=0
      - OPEN_BROWSER=0
      - TRUST_PROXY_HEADERS=1
      - SESSION_COOKIE_SECURE=1
    restart: unless-stopped
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
