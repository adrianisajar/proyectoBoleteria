services:
  - type: web
    name: boleteria
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: FLASK_DEBUG
        value: "0"
      - key: OPEN_BROWSER
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: ADMIN_INICIAL_USUARIO
        value: admin
      - key: ADMIN_INICIAL_PASSWORD
        generateValue: true
      - key: MAX_CONTENT_LENGTH_MB
        value: "16"
      - key: LOG_LEVEL
        value: INFO
      - key: MONGO_DB
        value: sistema_boleteria
      - key: TZ_OFFSET
        value: "-05:00"
      - key: SESSION_COOKIE_DAYS
        value: "7"
      - key: SESSION_IDLE_TIMEOUT_SECONDS
        value: "1800"
      # NOTA: copiar SECRET_KEY y ADMIN_INICIAL_PASSWORD generados al .env local
    healthCheckPath: /health
