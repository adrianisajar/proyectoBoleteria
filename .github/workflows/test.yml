name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check motores tests *.py
      - run: python -m ruff format --check motores tests *.py

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests -q --no-header -p no:cacheprovider
