{% extends "base.html" %}
{% block title %}{{ codigo }} — Sistema de Facturación{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="text-center py-5">
            <div class="display-1 fw-bold text-primary">{{ codigo }}</div>
            <h1 class="h3 mt-2">{{ titulo }}</h1>
            <p class="text-secondary mt-3">{{ mensaje }}</p>
            <a class="btn btn-primary mt-3" href="{{ url_for('dashboard') }}">
                <i class="bi bi-house-door me-2"></i>Volver al inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
